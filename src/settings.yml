---
strategy: static
no_screen_padding: 'yes'
dark_mode: 'no'
static_data: '{}'
polling_verb: get
framework_version: latest
polling_url: ''
polling_headers: ''
name: Lava Lamp
description: Full-screen generative lava lamp
refresh_interval: 15
custom_fields:
- keyname: author_bio
  name: About This Plugin
  field_type: author_bio
  description: A full-screen lava lamp whose red wax slowly rises, sinks and merges across refreshes.
  github_url: https://github.com/nikokoren/lava_lamp
