# TRMNLP configuration
# {{ env.VARIABLE }} interpolation is available here
---
# auto-reload when files change (`watch: false` to disable)
watch:
  - .trmnlp.yml
  - src

# values of custom fields (defined in src/settings.yml)
custom_fields:
  liquid_color: yellow
  speed: slow

# override variables
variables:
  trmnl: {}

# The scene has no text, so the rule that asks for framework text elements
# (title, value, label, description) does not apply.
ignored_lint_rules:
  - framework_elements_used
